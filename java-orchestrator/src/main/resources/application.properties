spring.application.name=java-orchestrator
server.port=${PORT:8080}

# Ingestion configuration
sops.directory.path=${SOPS_DIRECTORY_PATH:../data/sops}
python.engine.url=${PYTHON_ENGINE_URL:http://localhost:8000}
sops.scan.interval.ms=${SOPS_SCAN_INTERVAL_MS:60000}

# Logging
logging.level.com.uoa.javaorchestrator=INFO
